<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India's Fall 2026 Master Learning Dashboard — Draft 20</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --board:#382A21;--paper:#FBF7ED;--paper2:#F3ECDD;--ink:#2A211A;--muted:#6E6255;--faint:#9C917F;--line:#DCD2BC;--gold:#C9A15A;
  --smc:#315F8A;--codepath:#6E4F9E;--perscholas:#2E7D5B;--study:#B87F1F;--deadline:#A6373B;--notes:#2E8C8C;
  --python:#4F74B7;--web:#7A4EA3;--cyber:#2E7D5B;--cs4:#B5522F;--cs3:#8A6B2E;--fund:#8A5E1D;
  --good:#E5F2EA;--warn:#FBF2E1;--bad:#FBEDEA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;padding:28px 16px 60px;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;
background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.05),transparent 45%),radial-gradient(ellipse at 85% 80%,rgba(255,255,255,.04),transparent 50%),var(--board)}
.wrap{max-width:1180px;margin:0 auto}
.masthead{text-align:center;margin-bottom:20px}
.kicker{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Zilla Slab',serif;font-size:clamp(30px,5vw,46px);color:var(--paper);margin-top:6px}
.sub{color:rgba(251,247,237,.68);font-size:13.5px;margin-top:7px;font-family:'IBM Plex Mono',monospace}
.tabs,.subtabs{display:flex;gap:6px;overflow-x:auto;padding:0 2px}
.tabs{margin:24px 0 -1px}.subtabs{margin:0 0 20px}
.tab,.subtab{flex:0 0 auto;cursor:pointer;border:1px solid rgba(251,247,237,.18);border-bottom:none;border-radius:9px 9px 0 0;padding:10px 14px 12px;background:rgba(251,247,237,.10);color:var(--paper);font:600 11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;opacity:.67}
.tab.active{background:var(--paper);color:var(--ink);border-color:var(--paper);opacity:1}
.subtab{border:1px solid var(--line);border-radius:18px;background:var(--paper2);color:var(--muted);padding:7px 11px;opacity:1}
.subtab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.board{background:var(--paper);border-radius:4px 14px 14px 14px;box-shadow:0 18px 40px rgba(0,0,0,.35);min-height:560px;padding:28px 24px 36px}
@media(min-width:720px){.board{padding:36px 40px 44px}}
.panel-title{font-family:'Zilla Slab',serif;font-size:25px;font-weight:700;margin-bottom:5px}
.panel-sub{color:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:22px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:17px 18px;margin-bottom:14px}
.card:before{content:'';position:absolute;top:-7px;left:20px;width:34px;height:14px;border-radius:2px;background:var(--tone,var(--gold));box-shadow:0 3px 5px rgba(0,0,0,.25)}
.card h3{font-family:'Zilla Slab',serif;font-size:19px;margin-bottom:8px}.meta{font-size:12.5px;color:var(--muted);line-height:1.6}
.field{margin-top:12px}label{font:600 10.5px 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
textarea,input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 10px;font:13px 'IBM Plex Sans',sans-serif;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}.inline2{display:grid;grid-template-columns:1fr;gap:9px}.inline3{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:660px){.inline2{grid-template-columns:1fr 1fr}.inline3{grid-template-columns:repeat(3,1fr)}}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 13px;cursor:pointer;font:600 11.5px 'IBM Plex Mono',monospace}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;font:600 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:10px}
.ok{background:#E1EFE7;color:#1F6B48}.pending{background:#FBF2E1;color:#8C6416}.info{background:#E7EEF7;color:#315F8A}.conflict{background:#FBEDEA;color:#9B2F34}
.alert{border-left:4px solid var(--deadline);background:var(--bad);border-radius:0 8px 8px 0;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:10px}
.alert b{display:block;font:600 11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--deadline);margin-bottom:3px}
.alert.amber{border-color:var(--study);background:var(--warn)}.alert.amber b{color:#8C6416}.alert.green{border-color:var(--perscholas);background:var(--good)}.alert.green b{color:var(--perscholas)}
.feedback{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.feedback strong{color:var(--ink)}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.stat{flex:1 1 145px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .num{font-family:'Zilla Slab',serif;font-size:23px;font-weight:700}.stat .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.small{font-size:11.5px;color:var(--muted);line-height:1.5}.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font:600 10.5px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 9px;border-bottom:2px solid var(--ink)}
td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:none}
.month-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal .dow{background:var(--ink);color:var(--paper);font:600 10px 'IBM Plex Mono',monospace;text-align:center;padding:8px;border-right:1px solid #55483d}
.daycell{min-height:125px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:var(--paper)}
.daycell.muted{background:#F7F1E5;color:var(--faint)}.date{font:600 10.5px 'IBM Plex Mono',monospace;margin-bottom:5px}
.event{font-size:10.5px;line-height:1.25;padding:4px 5px;border-radius:5px;margin:3px 0;color:#fff}.event small{display:block;opacity:.85;font-size:9.5px}
.todo{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.todo.done .todo-title{text-decoration:line-through;color:var(--faint)}
.todo-meta{font-size:11px;color:var(--muted);margin-top:3px}.todo-actions{grid-column:2;display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.learn-card{border:1px solid var(--line);border-radius:10px;padding:15px;background:var(--paper2);margin-bottom:12px}
.promptbox{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:10px}
.funding-item{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;margin:10px 0}.fund-title{font-weight:700}
footer{color:rgba(251,247,237,.55);text-align:center;font-size:11px;margin-top:16px;font-family:'IBM Plex Mono',monospace}
.mic-btn{margin-left:6px;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:13px;vertical-align:middle}
.mic-btn.listening{background:#FBEDEA;border-color:#A6373B}
.input-wrap{display:flex;align-items:flex-start;gap:4px}.input-wrap>input,.input-wrap>textarea{flex:1}
.upload-zone{border:2px dashed var(--line);border-radius:10px;background:var(--paper);padding:14px;margin-top:12px}
.upload-zone input[type=file]{width:100%;font-size:12px}
.file-item{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px;margin-top:8px}
.file-name{font-weight:600;font-size:12.5px}.file-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.file-preview{max-width:180px;max-height:140px;border-radius:7px;margin-top:8px;border:1px solid var(--line)}
.text-preview{white-space:pre-wrap;max-height:160px;overflow:auto;font:11px 'IBM Plex Mono',monospace;background:#fffaf0;border:1px solid var(--line);padding:8px;border-radius:6px;margin-top:8px}
.req{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.req:last-child{border-bottom:none}
.req input{margin-top:3px;width:16px;height:16px}.req.done .req-text{text-decoration:line-through;color:var(--faint)}
.req-text{font-size:13px;line-height:1.4}.req-note{font-size:11px;color:var(--muted);margin-top:3px}
.cal-add-btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:11px;margin-top:5px}
.cal-item-row{border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:8px;background:var(--paper)}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.month-head{font-size:11px;font-weight:700;text-align:center;color:var(--muted);padding:4px 0}
.month-day{border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:360px;overflow:hidden;position:relative}
.month-day.off{opacity:.68}
.month-day-top{display:flex;justify-content:space-between;align-items:center;padding:6px 7px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700}
.day-timeline{position:relative;height:300px;margin:6px 5px 7px 22px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(5% - 1px),rgba(80,70,60,.10) calc(5% - 1px),rgba(80,70,60,.10) 5%)}
.hour-label{position:absolute;left:-23px;transform:translateY(-50%);font-size:8px;color:var(--muted);line-height:1}
.timeline-event{position:absolute;left:3px;right:2px;border-radius:4px;padding:2px 4px;font-size:8px;line-height:1.15;overflow:hidden;border:1px solid rgba(0,0,0,.12);background:var(--paper);box-shadow:0 1px 1px rgba(0,0,0,.04)}
.timeline-event strong{font-size:8px}
.free-gap{position:absolute;left:3px;right:2px;border:1px dashed rgba(60,90,70,.28);border-radius:4px;background:rgba(80,140,100,.035);font-size:7px;color:#52685a;padding:1px 3px;overflow:hidden}
.timeline-all-day{font-size:8px;margin:3px 5px;padding:3px 4px;border-radius:4px;background:#f7eee9;border:1px solid var(--line)}
.month-legend-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:1000px){.month-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.month-head{display:none}.month-day{min-height:390px}}
@media(max-width:620px){.month-grid{grid-template-columns:1fr}.month-day{min-height:410px}.day-timeline{height:330px}}




.true-month-wrap{overflow-x:auto;padding-bottom:10px}
.true-month-grid{display:grid;grid-template-columns:54px repeat(7,minmax(155px,1fr));min-width:1180px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.true-corner,.true-day-head{height:42px;background:#2e241c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-right:1px solid rgba(255,255,255,.14)}
.true-day-head small{display:block;font-weight:400;opacity:.8;margin-left:4px}
.time-rail{position:relative;height:780px;background:#f6f0e4;border-right:1px solid var(--line)}
.time-label{position:absolute;right:6px;transform:translateY(-50%);font-size:9px;color:var(--muted);white-space:nowrap}
.true-day-col{position:relative;height:780px;border-right:1px solid var(--line);background:
 repeating-linear-gradient(to bottom,transparent 0,transparent calc(5.128205% - 1px),rgba(80,70,60,.10) calc(5.128205% - 1px),rgba(80,70,60,.10) 5.128205%)}
.true-day-col.sunday{background:#fbf3ef}
.true-event{position:absolute;left:5px;right:5px;border-radius:6px;padding:4px 5px;font-size:9px;line-height:1.15;overflow:hidden;border:1px solid rgba(0,0,0,.12);background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.05);z-index:2}
.true-event .ev-time{font-weight:700;display:block;margin-bottom:1px}
.true-open{position:absolute;left:5px;right:5px;border:1px dashed rgba(55,105,70,.35);border-radius:5px;background:rgba(80,140,100,.04);font-size:8px;color:#55705d;padding:3px 4px;overflow:hidden;z-index:1}
.true-all-day{position:absolute;top:4px;left:5px;right:5px;padding:5px;border-radius:5px;font-size:9px;background:#f5dede;border:1px solid #c98585;z-index:3}
.true-month-note{font-size:11px;color:var(--muted);margin:8px 0 12px}
@media(max-width:700px){.true-month-grid{min-width:1120px}.true-day-col,.time-rail{height:720px}}


.schedule-with-todos{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.todo-side{position:sticky;top:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:12px;max-height:82vh;overflow:auto}
.todo-side h3{margin:0 0 4px;font-size:18px}
.side-task{border:1px solid var(--line);border-left:5px solid #A6373B;border-radius:8px;padding:8px;margin:8px 0;background:#fffdf8}
.side-task-title{font-weight:700;font-size:12px;line-height:1.25}
.side-task-meta{font-size:10px;color:var(--muted);margin-top:4px}
.side-task-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
@media(max-width:1100px){.schedule-with-todos{grid-template-columns:1fr}.todo-side{position:relative;top:auto;max-height:none}}


.planner-shell{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(430px,1.18fr);gap:16px;align-items:start;margin-bottom:18px}
.planner-card{border:1px solid var(--line);background:var(--paper);border-radius:10px;overflow:hidden}
.planner-bar{padding:8px 10px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);background:#dbeef0}
.planner-bar.todo{background:#e8f0c9}
.planner-bar.notes{background:#eadcf2}
.mini-month{width:100%;border-collapse:collapse;table-layout:fixed}
.mini-month th,.mini-month td{border:1px solid var(--line);text-align:center;padding:7px 4px;font-size:11px}
.mini-month th{background:#faf7ef;font-weight:700}
.mini-month td{height:34px;cursor:pointer}
.mini-month td.has-item{font-weight:700;box-shadow:inset 0 -3px 0 #A6373B}
.mini-month td.todayish{background:#f7efe0}
.planner-notes{min-height:220px;width:100%;border:0;resize:vertical;padding:10px;font:inherit;background:repeating-linear-gradient(to bottom,#fffdf8 0,#fffdf8 27px,#ddd 28px)}
.todo-sheet{width:100%;border-collapse:collapse;table-layout:fixed}
.todo-sheet th,.todo-sheet td{border:1px solid var(--line);padding:6px 7px;font-size:11px;vertical-align:middle}
.todo-sheet th{background:#fafbf2;text-align:left}
.todo-sheet .done-col{width:48px;text-align:center}
.todo-sheet .date-col{width:105px}
.todo-sheet input[type="text"],.todo-sheet input[type="date"]{width:100%;border:0;background:transparent;padding:2px;font:inherit}
.todo-sheet input[type="checkbox"]{transform:scale(1.15)}
.todo-sheet tr.done-row{opacity:.55;text-decoration:line-through}
.planner-actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px}
.schedule-section-label{font-size:16px;font-weight:700;margin:14px 0 8px}
@media(max-width:980px){.planner-shell{grid-template-columns:1fr}}


/* Draft 14 — responsive mobile layout */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select,textarea{font-size:16px}
img,svg,canvas{max-width:100%;height:auto}

/* Let all core grids collapse cleanly */
@media(max-width:900px){
  .panel,.paper,.content,.main,.app,.dashboard{max-width:100%!important;width:100%!important}
  .inline2,.inline3{grid-template-columns:1fr!important}
  .planner-shell{grid-template-columns:1fr!important;gap:12px}
  .schedule-with-todos{grid-template-columns:1fr!important}
  .todo-side{position:relative!important;top:auto!important;max-height:none!important;width:auto!important}
  .card{overflow:hidden}
}

/* Mobile navigation: horizontal swipeable tabs instead of cramped wrapping */
@media(max-width:700px){
  body{padding:0!important;margin:0!important}
  .paper,.panel,.content,.main{border-radius:0!important}
  .tabs,.subtabs,.tabrow{
    display:flex!important;
    overflow-x:auto!important;
    overflow-y:hidden!important;
    flex-wrap:nowrap!important;
    gap:6px!important;
    padding-bottom:5px!important;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar,.tabrow::-webkit-scrollbar{display:none}
  .tab,.subtab,.tabs button,.subtabs button{
    flex:0 0 auto!important;
    white-space:nowrap!important;
    min-height:42px!important;
    padding:10px 12px!important;
  }

  .panel-title{font-size:24px!important;line-height:1.1}
  .panel-sub{font-size:13px!important;line-height:1.45}
  .card{padding:12px!important;margin-bottom:12px!important}
  .btn,.btn.ghost{min-height:42px;padding:10px 12px!important}
  .btnrow{gap:7px!important}
  .field label{font-size:12px}
  input,select,textarea{min-height:42px;max-width:100%;box-sizing:border-box}
  textarea{min-height:90px}

  /* Planner section becomes one clean phone column */
  .planner-shell{display:block!important}
  .planner-card{width:100%!important;margin-bottom:12px!important}
  .planner-bar{font-size:15px!important;padding:10px!important}
  .mini-month th,.mini-month td{padding:8px 2px!important;font-size:12px!important}
  .mini-month td{height:38px!important}
  .planner-notes{min-height:170px!important}
  .todo-sheet th,.todo-sheet td{font-size:12px!important;padding:7px 5px!important}
  .todo-sheet .date-col{width:112px!important}
  .todo-sheet .done-col{width:50px!important}

  /* Persistent running tasks move below schedule and stay full-width */
  .todo-side{margin-top:14px!important}
  .side-task{padding:10px!important}
  .side-task-title{font-size:14px!important}
  .side-task-meta{font-size:11px!important}

  /* Monthly spatial calendar stays accurate but scrolls inside its own frame */
  .true-month-wrap{
    overflow-x:auto!important;
    width:100%!important;
    -webkit-overflow-scrolling:touch;
    padding-bottom:12px!important;
  }
  .true-month-grid{
    min-width:1040px!important;
    grid-template-columns:54px repeat(7,140px)!important;
  }
  .true-day-col,.time-rail{height:680px!important}
  .true-day-head{font-size:11px!important}
  .true-event{font-size:9px!important;padding:3px 4px!important}
  .true-open{font-size:8px!important}
  .time-label{font-size:9px!important}

  /* Calendar synopsis: each day becomes a readable card */
  .month-grid{grid-template-columns:1fr!important;gap:10px!important}
  .month-head{display:none!important}
  .month-day{min-height:390px!important}
  .day-timeline{height:330px!important}

  /* Course / requirements / learning sections */
  table{max-width:100%}
  .tablewrap,.table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
}

/* Extra-small iPhones */
@media(max-width:430px){
  .panel-title{font-size:21px!important}
  .card h3{font-size:17px!important}
  .planner-bar{font-size:14px!important}
  .mini-month th,.mini-month td{font-size:11px!important}
  .todo-sheet .date-col{width:104px!important}
  .true-month-grid{min-width:980px!important;grid-template-columns:50px repeat(7,132px)!important}
}

/* Home-screen / safe-area support */
@supports(padding:max(0px)){
  body{
    padding-left:max(0px,env(safe-area-inset-left));
    padding-right:max(0px,env(safe-area-inset-right));
    padding-bottom:max(0px,env(safe-area-inset-bottom));
  }
}


/* Draft 15 — hard mobile-width fix */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.wrap{width:100%;max-width:1180px}
.board{width:100%;max-width:100%;overflow:hidden}
.schedule-with-todos,.schedule-with-todos>div,.planner-shell,.planner-shell>div,
.planner-card,.true-month-wrap,.month-grid,.card{min-width:0!important;max-width:100%}
.true-month-wrap{contain:inline-size}

.mobile-todo-cards{display:none}
.mobile-note-cards{display:none}

@media(max-width:700px){
  .wrap{width:100%!important;max-width:100%!important;margin:0!important}
  .masthead{padding:14px 14px 2px!important;text-align:left!important}
  .masthead h1{font-size:26px!important}
  .sub{font-size:11px!important;line-height:1.35!important}
  .tabs{padding:0 10px!important;margin-top:12px!important}
  .board{padding:18px 14px 26px!important;border-radius:0!important;width:100%!important;max-width:100%!important}
  .schedule-with-todos{display:block!important;width:100%!important;max-width:100%!important}
  .schedule-with-todos>div{width:100%!important;max-width:100%!important;overflow:hidden!important}
  .planner-shell{display:block!important;width:100%!important;max-width:100%!important}
  .planner-shell>div{width:100%!important;max-width:100%!important}
  .planner-card{width:100%!important;max-width:100%!important}
  .mini-month{width:100%!important;max-width:100%!important}
  .mini-month th,.mini-month td{padding:6px 1px!important;font-size:10px!important}
  .mini-month td{height:34px!important}

  /* Desktop to-do table becomes phone-friendly cards */
  .todo-sheet{display:none!important}
  .mobile-todo-cards{display:block!important;padding:8px}
  .m-task{border:1px solid var(--line);border-left:5px solid var(--deadline);border-radius:8px;background:#fffdf8;padding:10px;margin:8px 0}
  .m-task.done{opacity:.55}
  .m-task-top{display:flex;align-items:flex-start;gap:9px}
  .m-task-title{font-size:13px;font-weight:600;line-height:1.35;flex:1}
  .m-task-date{font-size:11px;color:var(--muted);margin:6px 0 0 26px}
  .m-task input[type=date]{margin:7px 0 0 26px;width:calc(100% - 26px)!important}

  /* Running Things To Do stays beneath planner, no desktop side rail */
  .todo-side{width:100%!important;max-width:100%!important;margin:12px 0 0!important}

  /* True time calendar is contained inside its own scroller, not allowed to widen page */
  .true-month-wrap{
    display:block!important;
    width:100%!important;
    max-width:100%!important;
    overflow-x:auto!important;
    overflow-y:hidden!important;
    -webkit-overflow-scrolling:touch!important;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .true-month-grid{
    width:980px!important;
    min-width:980px!important;
    max-width:none!important;
    grid-template-columns:50px repeat(7,132px)!important;
  }

  /* Notes mobile cards */
  .notes-desktop-grid{display:none!important}
  .mobile-note-cards{display:block!important}
  .note-entry-card{border:1px solid var(--line);border-radius:9px;background:var(--paper2);padding:11px;margin:10px 0}
}


/* Draft 16 — final phone fit */
@media(max-width:700px){
  /* Keep the compact month entirely visible: all 7 days fit on-screen */
  .planner-card .mini-month{
    width:100%!important;
    table-layout:fixed!important;
    border-collapse:collapse!important;
  }
  .planner-card .mini-month th,
  .planner-card .mini-month td{
    width:14.2857%!important;
    min-width:0!important;
    max-width:none!important;

    white-space:nowrap!important;
  }
  .planner-card .mini-month td{height:32px!important}

  .schedule-tabs,
  .subtabs{
    width:100%!important;
    max-width:100%!important;
    display:grid!important;

}

 state.courses[id]=Object.assign({prof:s.prof||'',email:'',officeHours:'',officeLocation:'',labHours:'',labLocation:'',tutoring:'',canvas:'',syllabus:'',concepts:'',keywords:'',takeaways:'',questions:'',assignments:'',notes:''},state.courses[id]);
 if(!state.learning[id])state.learning[id]={topic:'',explain:'',practice:'',quiz:'',reflection:''};
}
for(const k of ['grants','loans','scholarships','fellowships']) if(!state.funding[k]) state.funding[k]=[];
if(!state.seededDraft6){
 state.funding.grants.push({
   id:260930,
   n:'AAUW Career Development Grant — Winter/Spring 2027',
   org:'AAUW',

 });
 const addTodoOnce=(title,due,course='general',priority='High')=>{
   if(!state.todos.some(t=>t.title===title)) state.todos.push({id:Date.now()+Math.random(),title,due,course,priority,done:false});
 };
 const addReminderOnce=(title,date)=>{
   if(!state.reminders.some(r=>r.title===title)) state.reminders.push({id:Date.now()+Math.random(),title,date,done:false});
 };
 addTodoOnce('AAUW — open application portal and verify program eligibility','2026-09-04');

 addTodoOnce('AAUW — gather accreditation/industry credential verification links','2026-09-07');
 addTodoOnce('AAUW — find current reputable data showing women are underrepresented in the target field','2026-09-08');
 addTodoOnce('AAUW — draft challenge/barriers narrative (3,000-character limit)','2026-09-10');
 addTodoOnce('AAUW — draft commitment to women and girls narrative (3,000-character limit)','2026-09-12');
 addTodoOnce('AAUW — draft career goals/program/grant narrative (5,000-character limit)','2026-09-15');
 addTodoOnce('AAUW — upload documents and complete full application checklist','2026-09-20');
 addTodoOnce('AAUW — final completeness review; verify every upload and citation','2026-09-27');

 addReminderOnce('CodePath Web Dev — register for Sep 11 orientation','2026-09-05');
 addReminderOnce('CodePath — add calendar@codepath.com and operations@codepath.org to contacts','2026-09-06');
 addReminderOnce('CodePath Web Dev — orientation at 12:00 PM PT','2026-09-11');

 addReminderOnce('CodePath Intro to Web Development — first class 3:00–5:00 PM PT','2026-09-16');
 state.seededDraft6=true;
 save();
}
if(!state.seededDraft8){
 const addTodo8=(title,due='',course='ps',priority='High')=>{
   if(!state.todos.some(t=>t.title===title)) state.todos.push({id:Date.now()+Math.random(),title,due,course,priority,done:false});
 };
 addTodo8('Per Scholas — schedule admissions interview');

 state.seededDraft8=true;

function save(){localStorage.setItem('india-dashboard-d3',JSON.stringify(state))}
function esc(v=''){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
const TABS=[['home','This Week',C.study],['schedule','MY MASTER SCHEDULE',C.smc],['courses','Courses',C.smc],['todo','To Do',C.deadline],['learning','Interactive Learning',C.codepath],['funding','Funding',C.fund],['reminders','Reminders',C.deadline],['notes','Notes',C.notes]];
function renderTabs(){tabs.innerHTML=TABS.map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" onclick="setTab('${t[0]}')"><span class="dot" style="background:${t[2]}"></span>${t[1]}</button>`).join('')}
function setTab(x){state.tab=x;save();renderTabs();render()}
function goTab(x){setTab(x);window.scrollTo({top:0,behavior:'smooth'})}
function subtabs(items,current,setter){return `<div class="subtabs schedule-switcher">${items.map(x=>`<button class="subtab ${current===x[0]?'active':''}" onclick="${setter}('${x[0]}')">${x[1]}</button>`).join('')}</div>`}


function setProgramDate(id,key,val){
 state.programDates[id]=state.programDates[id]||{};
 state.programDates[id][key]=val; save(); render();
}
function ymdLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDaysYmd(ymd,days){const d=new Date(ymd+'T12:00:00');d.setDate(d.getDate()+days);return ymdLocal(d)}
function psEndDate(){
 const p=state.programDates.ps||{};
 if(!p.start)return '';
 const weeks=Math.max(1,Number(p.weeks)||15);
 return addDaysYmd(p.start,weeks*7-1);
}
function taskColor(course){
 const colors={ps:'#2E7D5B',cp_web:'#7A4EA3',smc_py:'#4F74B7',smc_cs4:'#B5522F',smc_cs3:'#8A6B2E',general:'#A6373B'};
 return colors[course]||'#A6373B';
}
function taskLabel(t){return `${t.done?'✓ ':''}${t.title}`}
function dueTasks(ymd){return todosOnDate(ymd).map(t=>({t:t.time?(clockLabel(t.time)+(t.endTime?'–'+clockLabel(t.endTime):'')):'DUE',n:taskLabel(t),c:t.done?'#6E6255':taskColor(t.course)}))}
function clockLabel(v){if(!v)return '';const [h,m]=v.split(':').map(Number),ap=h>=12?'PM':'AM',hh=(h%12)||12;return `${hh}:${String(m).padStart(2,'0')} ${ap}`}
function todoTimeRange(t){
 const start=parseClockToMinutes(t&&t.time);
 if(start==null)return null;
 let end=parseClockToMinutes(t&&t.endTime);
 if(end==null||end<=start)end=start+30;
 return {start,end:Math.min(1170,end)};
}

function todoOccursOn(t,ymd){
 const start=t.due||t.startDate||'';
 if(!start)return false;
 if(ymd<start)return false;
 const end=t.endDate||start;
 if(ymd>end)return false;
 const repeat=t.repeat||'none';
 if(repeat==='none') return ymd===start;
 const d=new Date(ymd+'T12:00:00'),dow=d.getDay();
 if(repeat==='weekdays') return dow>=1&&dow<=5;
 if(repeat==='daily') return true;
 return ymd===start;
}
function todosOnDate(ymd){return state.todos.filter(t=>todoOccursOn(t,ymd))}

function normalizedTodoRange(t){
  const startVal=t.time||t.startTime||t.start||'';
  const endVal=t.endTime||t.finishTime||t.end||'';
  const start=parseClockToMinutes(startVal);
  if(start==null)return null;
  let end=parseClockToMinutes(endVal);
  if(end==null||end<=start)end=start+30;
  return {start,end:Math.min(1170,end)};
}
function todoCalendarEvents(ymd){
  return todosOnDate(ymd).map(t=>{
    const tr=normalizedTodoRange(t);
    return tr
      ? {start:tr.start,end:tr.end,title:'TO DO — '+taskLabel(t),color:t.done?'#6E6255':taskColor(t.course)}
      : {allDay:true,title:'DUE — '+taskLabel(t),color:t.done?'#6E6255':taskColor(t.course)};
  });
}
function addMonthlyBlock(){
  const title=document.getElementById('mb-title').value.trim();
  const date=document.getElementById('mb-date').value;
  const start=document.getElementById('mb-start').value;
  const end=document.getElementById('mb-end').value;
  const category=document.getElementById('mb-category').value;
  const makeTodo=document.getElementById('mb-todo').checked;
  if(!title||!date||!start||!end)return alert('Enter title, date, start time, and end time.');
  if(parseClockToMinutes(end)<=parseClockToMinutes(start))return alert('End time must be after start time.');
  state.calendarEvents.push({id:Date.now(),title,date,time:start,endTime:end,category,done:false,reminder:'none',notes:'Added directly from Monthly Schedule'});
  if(makeTodo){
    state.todos.push({id:Date.now()+1,title,due:date,endDate:'',time:start,endTime:end,repeat:'none',reminder:'none',course:category,priority:'Medium',done:false});
  }
  save();render();
  setTimeout(()=>alert('Added to the Monthly Calendar.'),0);
}

function todoICS(t){
 if(!t||!t.due)return alert('Add a due date first.');
 const e={title:'To Do: '+t.title,date:t.due,time:t.time||'09:00',endTime:t.endTime||'',reminder:t.reminder||'none',notes:'Dashboard To Do · '+(t.priority||'Medium')+' priority'};
 downloadICS(e);
}
function reminderICS(r){
 if(!r||!r.date)return alert('Add a date first.');
 const e={title:'Reminder: '+r.title,date:r.date,time:r.time||'09:00',reminder:r.alert||'none',notes:'Dashboard reminder'};
 downloadICS(e);
}


function addCalendarEvent(){
 const title=(document.getElementById('ce-title')||{}).value?.trim();
 const date=(document.getElementById('ce-date')||{}).value;
 const time=(document.getElementById('ce-time')||{}).value||'';
 const endTime=(document.getElementById('ce-end-time')||{}).value||'';
 const category=(document.getElementById('ce-category')||{}).value||'general';
 const type=(document.getElementById('ce-type')||{}).value||'Appointment';
 const reminder=(document.getElementById('ce-reminder')||{}).value||'none';
 const notes=(document.getElementById('ce-notes')||{}).value?.trim()||'';
 const makeTodo=(document.getElementById('ce-todo')||{}).checked;
 if(!title||!date)return alert('Enter a title and date.');
 if(time&&endTime&&parseClockToMinutes(endTime)<=parseClockToMinutes(time))return alert('End time must be after start time.');
 const id=Date.now();
 state.calendarEvents.push({id,title,date,time,endTime,category,type,reminder,notes,done:false});
 if(makeTodo){
   state.todos.push({id:id+1,title,due:date,endDate:'',time,endTime,repeat:'none',course:category,priority:'Medium',done:false,calendarEventId:id});
 }
 save();render();
 setTimeout(()=>alert('Added to the dashboard calendar.'),0);
}
function deleteCalendarEvent(id){
 state.calendarEvents=state.calendarEvents.filter(e=>e.id!=id);
 state.todos=state.todos.filter(t=>t.calendarEventId!=id);
 save();render();
}
function toggleCalendarEvent(id){
 const e=state.calendarEvents.find(x=>x.id==id);if(e)e.done=!e.done;
 const t=state.todos.find(x=>x.calendarEventId==id);if(t)t.done=e?.done||false;
 save();render();
}
function editCalendarEvent(id,key,val){
 const e=state.calendarEvents.find(x=>x.id==id);if(!e)return;e[key]=val;
 const t=state.todos.find(x=>x.calendarEventId==id);
 if(t){if(key==='title')t.title=val;if(key==='date')t.due=val;if(key==='category')t.course=val;}
 save();render();
}
function directEventsForDate(ymd){
 return state.calendarEvents.filter(e=>e.date===ymd).map(e=>({n:`${e.time?e.time+' ':''}${e.done?'✓ ':''}${e.title}`,c:e.done?'#6E6255':taskColor(e.category)}));
}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function reminderTrigger(v){
 return {m10:'-PT10M',m30:'-PT30M',h1:'-PT1H',d1:'-P1D'}[v]||'';
}
function dtLocal(date,time){
 const t=(time||'09:00').replace(':','')+'00';
 return date.replaceAll('-','')+'T'+t;
}
function downloadICS(e){
 const start=dtLocal(e.date,e.time||'09:00');
 const d=new Date(e.date+'T'+(e.time||'09:00')+':00');
 d.setHours(d.getHours()+1);
 const end=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
 const trig=reminderTrigger(e.reminder);
 const alarm=trig?`BEGIN:VALARM\nTRIGGER:${trig}\nACTION:DISPLAY\nDESCRIPTION:${icsEscape(e.title)}\nEND:VALARM\n`:'';
 const ics=`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//India Learning Dashboard//EN
CALSCALE:GREGORIAN
BEGIN:VEVENT
UID:${e.id}@india-learning-dashboard
DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z')}
DTSTART:${start}
DTEND:${end}
SUMMARY:${icsEscape(e.title)}
DESCRIPTION:${icsEscape(e.notes)}
${alarm}END:VEVENT
END:VCALENDAR`;
 const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(e.title||'calendar-event').replace(/[^\w-]+/g,'_')+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportAllCalendarICS(){
 if(!state.calendarEvents.length)return alert('No direct calendar events to export yet.');
 let body='';
 for(const e of state.calendarEvents){
   const start=dtLocal(e.date,e.time||'09:00');
   const d=new Date(e.date+'T'+(e.time||'09:00')+':00');d.setHours(d.getHours()+1);
   const end=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
   const trig=reminderTrigger(e.reminder);
   const alarm=trig?`BEGIN:VALARM\nTRIGGER:${trig}\nACTION:DISPLAY\nDESCRIPTION:${icsEscape(e.title)}\nEND:VALARM\n`:'';
   body+=`BEGIN:VEVENT
UID:${e.id}@india-learning-dashboard
DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z')}
DTSTART:${start}
DTEND:${end}
SUMMARY:${icsEscape(e.title)}
DESCRIPTION:${icsEscape(e.notes)}
${alarm}END:VEVENT
`;
 }
 const ics=`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//India Learning Dashboard//EN

function parseClockToMinutes(s){
 if(!s)return null;
 s=String(s).trim();
 if(/^\d{2}:\d{2}$/.test(s)){let [h,m]=s.split(':').map(Number);return h*60+m;}
 let m=s.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i);
 if(!m)return null;
 let h=Number(m[1]),min=Number(m[2]||0),ap=m[3].toUpperCase();
 if(h===12)h=0;if(ap==='PM')h+=12;return h*60+min;
}
function minsToLabel(m){
 m=Math.max(0,Math.min(1439,Math.round(m)));let h=Math.floor(m/60),min=m%60,ap=h>=12?'p':'a',hh=h%12||12;
 return `${hh}${min?':'+String(min).padStart(2,'0'):''}${ap}`;
}

function monthMatrix(year,month){
 const first=new Date(year,month,1),last=new Date(year,month+1,0),cells=[];
 const pad=(first.getDay()+6)%7; // Monday-first like planner image
 for(let i=0;i<pad;i++)cells.push(null);
 for(let d=1;d<=last.getDate();d++)cells.push(d);
 while(cells.length%7)cells.push(null);
 return cells;
}

function calendarSynopsis(){

 let cells='';
 for(let i=0;i<startPad;i++) cells+='<div></div>';

   cells+=`<div class="month-day ${dow===0?'off':''}"><div class="month-day-top"><span>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]}</span><span>${day}</span></div>${renderMiniTimeline(d)}</div>`;

function monthEvents(dateStr){
 const d=new Date(dateStr+'T12:00:00'), dow=d.getDay(), ev=[], ymd=dateStr;

 // Sunday is protected OFF
 if(dow===0){
   ev.push({t:'ALL DAY',n:'DAY OFF — no study / no catch-up',c:'#A6373B'});
   state.reminders.filter(r=>r.date===ymd&&!r.done).forEach(r=>ev.push({t:'Reminder',n:r.title,c:'#A6373B'}));
   ev.push(...dueTasks(ymd));
 state.calendarEvents.filter(e=>e.date===ymd).forEach(e=>ev.push({t:e.time||'Flexible',n:(e.done?'✓ ':'')+e.title,c:e.done?'#6E6255':taskColor(e.category)}));
   state.calendarEvents.filter(e=>e.date===ymd).forEach(e=>ev.push({t:e.time||'Flexible',n:(e.done?'✓ ':'')+e.title,c:e.done?'#6E6255':taskColor(e.category)}));
   return ev;
 }

 // Monday-Saturday morning routine
 ev.push({t:'12:00 AM',n:'Personal time / food prep / laundry / life admin',c:'#8A6B2E'});
 ev.push({t:'3:45 AM',n:'Study block',c:'#B87F1F'});
 ev.push({t:'7:00 AM',n:'Workout',c:'#2E8C8C'});

 // Specific morning study rotation
 if(dow===1) ev.push({t:'3:45 AM',n:'SMC CS 87A — Python',c:'#4F74B7'});
 if(dow===2) ev.push({t:'3:45 AM',n:'ALL COURSES — mixed study',c:'#2E7D5B'});
 if(dow===3) ev.push({t:'3:45 AM',n:'SMC CS 4',c:'#B5522F'});

 // Per Scholas weekdays only during editable cohort window
 const psStart=(state.programDates.ps||{}).start, psEnd=psEndDate();
 if(psStart && ymd>=psStart && (!psEnd || ymd<=psEnd) && dow>=1&&dow<=5) ev.push({t:'9:00 AM',n:'Per Scholas — '+((state.programDates.ps||{}).status||'Pending'),c:'#2E7D5B'});

 // Evening review structure
 if(dow===2||dow===4) ev.push({t:'4:00 PM',n:'ALL COURSES — review / assignments',c:'#B87F1F'});
 if(dow===3 && ymd>='2026-09-16') ev.push({t:'3:00 PM',n:'CodePath Web Development',c:'#7A4EA3'});
 if(dow===1||dow===5) ev.push({t:'4:00 PM',n:'Light review if needed',c:'#B87F1F'});

 // Night routine
 ev.push({t:'6:30 PM',n:'Wind down',c:'#6E6255'});
 ev.push({t:'7:00 PM',n:'Bedtime window begins',c:'#382A21'});

 // Important one-time milestones
 if(ymd==='2026-09-11') ev.push({t:'12:00 PM',n:'CodePath Web Orientation',c:'#7A4EA3'});
 if(ymd==='2026-09-21'){ev.push({t:'Flexible',n:'SMC CS 4 begins',c:'#B5522F'});ev.push({t:'Flexible',n:'SMC CS 87A Python begins',c:'#4F74B7'})}
 if(ymd==='2026-10-26') ev.push({t:'Flexible',n:'SMC CS 3 begins',c:'#8A6B2E'});
 if(ymd==='2026-12-11'){ev.push({t:'Flexible',n:'CS 4 ends',c:'#B5522F'});ev.push({t:'Flexible',n:'CS 87A ends',c:'#4F74B7'})}
 if(ymd==='2026-12-18') ev.push({t:'Flexible',n:'CS 3 ends',c:'#8A6B2E'});
 if((state.programDates.ps||{}).start===ymd) ev.push({t:'9:00 AM',n:'Per Scholas cohort begins',c:'#2E7D5B'});

 // User-added reminders + To Do due dates
 state.reminders.filter(r=>r.date===ymd&&!r.done).forEach(r=>ev.push({t:'Reminder',n:r.title,c:'#A6373B'}));

/* ---------- Local file storage for Interactive Learning ---------- */
const DB_NAME='india-learning-files', DB_STORE='files';
function openFileDB(){
 return new Promise((resolve,reject)=>{
   const r=indexedDB.open(DB_NAME,1);
   r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'key'})};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
async function handleLearningFiles(courseId,fileList){
 const db=await openFileDB(), tx=db.transaction(DB_STORE,'readwrite'), store=tx.objectStore(DB_STORE);
 for(const file of Array.from(fileList)){
   store.put({key:courseId+'::'+Date.now()+'::'+file.name,courseId,name:file.name,type:file.type,size:file.size,added:new Date().toISOString(),blob:file});
 }
 tx.oncomplete=()=>loadLearningFiles(courseId);
}
async function getCourseFiles(courseId){
 const db=await openFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction(DB_STORE,'readonly'), req=tx.objectStore(DB_STORE).getAll();
   req.onsuccess=()=>resolve(req.result.filter(x=>x.courseId===courseId).sort((a,b)=>b.added.localeCompare(a.added)));
   req.onerror=()=>reject(req.error);
 });
}
async function deleteLearningFile(key,courseId){
 const db=await openFileDB(),tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(key);tx.oncomplete=()=>loadLearningFiles(courseId);
}
async function openLearningFile(key){
 const db=await openFileDB();
 const rec=await new Promise((resolve,reject)=>{const r=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
 if(rec){const url=URL.createObjectURL(rec.blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}
}
async function loadLearningFiles(courseId){
 const holder=document.getElementById('files-'+courseId);if(!holder)return;
 const files=await getCourseFiles(courseId);
 if(!files.length){holder.innerHTML='<div class="small" style="margin-top:8px">No files uploaded for this class yet.</div>';return}
 holder.innerHTML='';
 for(const f of files){
   const div=document.createElement('div');div.className='file-item';
   let preview='';
   if((f.type||'').startsWith('image/')){
     const url=URL.createObjectURL(f.blob); preview=`<img class="file-preview" src="${url}" alt="">`;
   }
   div.innerHTML=`<div class="file-name">${esc(f.name)}</div><div class="file-meta">${f.type||'file'} · ${(f.size/1024).toFixed(1)} KB</div>${preview}<div class="btnrow"><button class="btn ghost" onclick="openLearningFile('${f.key.replace(/'/g,"\\'")}')">Open</button><button class="btn ghost" onclick="deleteLearningFile('${f.key.replace(/'/g,"\\'")}','${courseId}')">Delete</button></div>`;
   holder.appendChild(div);
   if(f.type.startsWith('text/') || /\.(txt|md|csv|json|py|js|css|html)$/i.test(f.name)){
     try{const txt=await f.blob.text();const pre=document.createElement('div');pre.className='text-preview';pre.textContent=txt.slice(0,5000);div.insertBefore(pre,div.querySelector('.btnrow'))}catch(e){}
   }
 }
}

/* ---------- Speech-to-text for text inputs / textareas ---------- */
function addMicButtons(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 document.querySelectorAll('input[type="text"], textarea').forEach(el=>{
   if(el.dataset.micAdded)return; el.dataset.micAdded='1';
   const btn=document.createElement('button');btn.type='button';btn.className='mic-btn';btn.title='Speak to text';btn.textContent='🎙️';
   btn.onclick=()=>{
     if(!SR){alert('Speech-to-text is not supported by this browser. Chrome, Edge, or Safari usually work best.');return}
     const r=new SR();r.lang='en-US';r.interimResults=false;r.continuous=false;btn.classList.add('listening');btn.textContent='●';
     r.onresult=e=>{
       const spoken=Array.from(e.results).map(x=>x[0].transcript).join(' ');
       const start=el.selectionStart??el.value.length,end=el.selectionEnd??el.value.length;
       el.value=el.value.slice(0,start)+(el.value && start>0?' ':'')+spoken+el.value.slice(end);
       el.dispatchEvent(new Event('input',{bubbles:true}));
     };
     r.onend=()=>{btn.classList.remove('listening');btn.textContent='🎙️'};r.onerror=()=>{btn.classList.remove('listening');btn.textContent='🎙️'};r.start();
   };
   el.insertAdjacentElement('afterend',btn);
 });
}

}
renderTabs();render();
